name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: host/package-lock.json
      - name: Install dependencies
        working-directory: host
        run: npm ci || npm install
      - name: Type check
        working-directory: host
        run: npx tsc --noEmit
      - name: Lint
        working-directory: host
        run: npx eslint src/
      - name: Tests
        working-directory: host
        run: npx vitest run
      - name: Coverage
        working-directory: host
        # vitest.config.ts holds the v8 provider + reporter config and
        # the (currently commented) 80/80/70/80 threshold policy. P7
        # baseline numbers + enforcement notes live in that config's
        # header comment. continue-on-error stays until coverage
        # catches up to the documented thresholds.
        run: npm run coverage
        continue-on-error: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: host-coverage
          path: host/coverage/
          if-no-files-found: ignore

  guest-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: guest -> target
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "25.x"
      - name: Format check
        working-directory: guest
        run: cargo fmt --check
      - name: Build guest agent
        working-directory: guest
        run: cargo build --release
      - name: Tests
        working-directory: guest
        run: cargo test
      - name: Clippy
        working-directory: guest
        run: cargo clippy -- -D warnings

  guest-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: guest -> target
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "25.x"
      - name: Format check
        working-directory: guest
        run: cargo fmt --check
      - name: Build guest agent
        working-directory: guest
        run: cargo build
      - name: Tests
        working-directory: guest
        run: cargo test
      - name: Clippy
        working-directory: guest
        run: cargo clippy -- -D warnings

  # Hyper-V control-plane service crate (P1, merged 3828913). Re-enabled
  # 2026-04-26 per audit A1: the comment-out marker outlived the worktree
  # merge that produced it. Builds, tests, and clippies the service
  # crate on a Windows runner — covers the named-pipe smoke test in
  # service/tests/named_pipe_smoke.rs which is #![cfg(target_os = "windows")]
  # and was not exercised in CI before this lane re-opened.
  service-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: . -> target
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "25.x"
      - name: Format check
        run: cargo fmt -p signalman-service --check
      - name: Build service
        run: cargo build -p signalman-service --release
      - name: Tests
        run: cargo test -p signalman-service
      - name: Clippy
        run: cargo clippy -p signalman-service --all-targets -- -D warnings

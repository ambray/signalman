# Gated E2E lane (P7 D4 — placeholder for the top of the test pyramid).
#
# Why this is GATED and not part of the default PR matrix:
#
# 1. Hyper-V is not available on standard GitHub-hosted runners. A real
#    end-to-end smoke restores a checkpoint, boots a VM, installs the
#    guest agent, and runs `signalman.run` against a scenario. None of
#    that can happen on `windows-latest` without nested-virt or a
#    self-hosted runner with Hyper-V enabled. The roadmap (P7 D4) calls
#    for migrating this lane to a self-hosted nightly Windows runner
#    once one exists; until then the workflow validates the toolchain
#    so the wiring stays exercised.
#
# 2. Long-running E2E jobs are flaky-by-construction (boot timing, IP
#    assignment, agent registration races). Running them on every PR
#    would mask real regressions in fast unit/integration lanes. Keeping
#    them opt-in protects PR signal.
#
# 3. Maintainers can opt in two ways:
#      - manual trigger via `workflow_dispatch` from the Actions tab,
#      - apply the `e2e` label to a PR (the lane fires on `labeled`).
#
# When P7 D4 is fully implemented, this lane will:
#   - restore a known checkpoint (`service-backend-smoke` or similar),
#   - start the service, install/start the guest agent in the VM,
#   - run `signalman run smoke` and assert envelope.result == "pass",
#   - upload the run envelope + service/guest logs as artifacts.
#
# For now it runs `scripts/e2e-smoke.ps1`, a placeholder that only
# verifies host/guest/service build and respond to `--help`/`--version`.
# See `docs/testing.md` (D5) and ROADMAP.md P7.3 D4.

name: E2E (gated)

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  e2e-windows:
    # Only run when this is a manual dispatch OR the PR was labeled `e2e`.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'e2e')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: . -> target
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: host/package-lock.json
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "25.x"

      - name: Install host dependencies
        working-directory: host
        run: npm ci || npm install
      - name: Build host (release)
        working-directory: host
        run: npm run build

      - name: Build guest agent (release)
        working-directory: guest
        run: cargo build --release

      - name: Build service (release)
        run: cargo build -p signalman-service --release

      - name: Run E2E smoke
        shell: pwsh
        run: ./scripts/e2e-smoke.ps1

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-logs
          path: "**/*.log"
          if-no-files-found: ignore

# Signalman host config — signalman repo's own self-test config.
#
# This config is consumed when running signalman CLI from the
# signalman repository cwd (for in-repo dogfooding scenarios like
# `live-browser-cdp-workflow`, `live-ui-*`, `service-backend-smoke`).
#
# Consumer projects (e.g. Example / collector) have their own
# .signalman/config.yaml in their repository root with their own
# guest credentials, auth tokens, and cert paths. Do NOT put
# consumer-specific values here — see the principle captured in
# the collector repo's memory/feedback_consumer_owns_recipe.md
# (2026-05-12): build/test recipes live with the implementation.
#
# Schema: see host/src/config.ts.

hypervisor:
  backend: service
  # Default guest credentials for signalman's own in-repo smoke
  # scenarios. Each self-test VM image is provisioned with these
  # values by signalman's own bootstrap. If you find yourself
  # editing these for a non-signalman scenario, that scenario
  # belongs in the consumer's repo + config, not here.
  guestCredentials:
    username: signalman-test
    password: signalman-test

guestAgent:
  defaultPort: 50051
  # Signalman's self-test auth token (regenerated by signalman's
  # bootstrap; not shared with consumer projects).
  authToken: ""
  tls:
    enabled: true
    caPath: ./.signalman/service-certs/ca.pem
    certPath: ./.signalman/service-certs/client.pem
    keyPath: ./.signalman/service-certs/client.key

scenarios:
  dir: ./.signalman/scenarios
  outputDir: ./output
  screenshotDir: ./output/screenshots

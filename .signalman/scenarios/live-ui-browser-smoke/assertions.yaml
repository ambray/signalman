assertions:
  - id: sidecar-ensured
    type: json_field
    source: step-0
    field: ready
    expected: true
    severity: critical
    description: "The browser smoke should start or confirm the native user-session UI sidecar"

  - id: sidecar-reachable
    type: json_field
    source: step-1
    field: sidecar_reachable
    expected: true
    severity: critical
    description: "The user-session UI sidecar should be reachable before launching a browser"

  - id: native-engine-active
    type: json_field
    source: step-1
    field: engine
    expected: native
    severity: critical
    description: "The browser smoke should exercise the native UI Automation engine"

  - id: desktop-cleaned
    type: json_field
    source: step-4
    field: success
    expected: true
    severity: high
    description: "The smoke should clear transient desktop UI before launching the browser"

  - id: browser-url-opened
    type: json_field
    source: step-6
    field: success
    expected: true
    severity: critical
    description: "The UI sidecar should open the browser URL through the Run dialog"

  - id: browser-url-normalized
    type: json_field
    source: step-6
    field: url
    expected: "http://example.test/signalman-browser-smoke"
    severity: high
    description: "The open-url workflow should report the normalized target URL"

  - id: browser-url-observed
    type: json_field
    source: step-8
    field: count
    comparison: gte
    expected: 1
    severity: critical
    description: "The launched browser should expose the target URL through UI Automation"

  - id: browser-navigate-url-succeeded
    type: json_field
    source: step-9
    field: success
    expected: true
    severity: critical
    description: "The browser workflow should navigate by focusing and typing into the address bar"

  - id: browser-navigate-url-observed
    type: json_field
    source: step-9
    field: observed
    expected: true
    severity: critical
    description: "The browser workflow should verify the typed URL through UI Automation"

  - id: browser-navigate-url-count
    type: json_field
    source: step-9
    field: observed_count
    comparison: gte
    expected: 1
    severity: critical
    description: "The browser should expose at least one matching address-bar value after navigation"

  - id: browser-snapshot-captured
    type: json_field
    source: step-10
    field: bytes
    comparison: gt
    expected: 0
    severity: critical
    description: "The browser observation loop should capture non-empty screenshot bytes"

  - id: browser-elements-found
    type: json_field
    source: step-10
    field: element_count
    comparison: gt
    expected: 0
    severity: high
    description: "The browser observation loop should include visible UI Automation elements"

  - id: address-bar-action-target
    type: json_field
    source: step-10
    field: "action_targets[?label=='Address and search bar'].actions"
    comparison: includes
    expected: type
    severity: high
    description: "The browser snapshot should expose the address bar as a compact LLM action target"

  - id: address-bar-browser-target
    type: json_field
    source: step-10
    field: "browser_targets[?label=='Address and search bar'].kind"
    comparison: includes
    expected: address_bar
    severity: high
    description: "The browser snapshot should identify the address bar as a reusable browser target"

  - id: browser-closed
    type: json_field
    source: step-11
    field: success
    expected: true
    severity: high
    description: "The smoke should close the launched browser window"

pass_threshold: 1.0
critical_must_pass: true

assertions:
  - id: screenshot-captured
    type: json_field
    source: step-0
    field: bytes
    comparison: gt
    expected: 0
    severity: critical
    description: "The UI sidecar should return non-empty screenshot bytes"

  - id: screenshot-format
    type: json_field
    source: step-0
    field: format
    expected: png
    severity: high
    description: "The screenshot workflow output should identify the image format"

  - id: start-button-ready
    type: json_field
    source: step-1
    field: found
    expected: true
    severity: critical
    description: "The Windows Start button should appear before interaction begins"

  - id: start-button-found
    type: json_field
    source: step-2
    field: count
    comparison: gte
    expected: 1
    severity: critical
    description: "The Windows Start button should be discoverable through UI Automation"

  - id: start-button-clicked
    type: json_field
    source: step-3
    field: success
    expected: true
    severity: critical
    description: "The UI sidecar should be able to click a discovered desktop element"

  - id: text-typed
    type: json_field
    source: step-5
    field: success
    expected: true
    severity: critical
    description: "The UI sidecar should be able to type into the interactive session"

  - id: key-sent
    type: json_field
    source: step-6
    field: success
    expected: true
    severity: critical
    description: "The UI sidecar should be able to send keyboard input to the interactive session"

  - id: snapshot-captured
    type: json_field
    source: step-7
    field: bytes
    comparison: gt
    expected: 0
    severity: critical
    description: "The UI snapshot should include non-empty screenshot bytes"

  - id: snapshot-elements-found
    type: json_field
    source: step-7
    field: element_count
    comparison: gt
    expected: 0
    severity: high
    description: "The UI snapshot should include visible UI Automation elements"

pass_threshold: 1.0
critical_must_pass: true

assertions:
  - id: sidecar-reachable
    type: json_field
    source: step-0
    field: sidecar_reachable
    expected: true
    severity: critical
    description: "The interactive user-session UI sidecar should be reachable"

  - id: native-engine-active
    type: json_field
    source: step-0
    field: engine
    expected: native
    severity: critical
    description: "The live smoke should exercise the native UI Automation engine"

  - id: screenshot-captured
    type: json_field
    source: step-1
    field: bytes
    comparison: gt
    expected: 0
    severity: critical
    description: "The UI sidecar should return non-empty screenshot bytes"

  - id: screenshot-format
    type: json_field
    source: step-1
    field: format
    expected: png
    severity: high
    description: "The screenshot workflow output should identify the image format"

  - id: search-button-ready
    type: json_field
    source: step-2
    field: found
    expected: true
    severity: critical
    description: "The Windows Search button should appear before interaction begins"

  - id: search-button-clicked
    type: json_field
    source: step-3
    field: success
    expected: true
    severity: critical
    description: "The UI sidecar should be able to click a discovered desktop element"

  - id: search-box-ready
    type: json_field
    source: step-4
    field: found
    expected: true
    severity: critical
    description: "The Windows Search edit box should be available after opening Search"

  - id: text-typed
    type: json_field
    source: step-6
    field: success
    expected: true
    severity: critical
    description: "The UI sidecar should be able to type into an explicitly selected edit control"

  - id: typed-text-observed
    type: json_field
    source: step-8
    field: elements[0].value
    expected: "signalman native smoke"
    severity: critical
    description: "The selected edit control should report the typed value through UI Automation"

  - id: typed-query-indexed
    type: json_field
    source: step-9
    field: count
    comparison: gte
    expected: 1
    severity: critical
    description: "The typed query should appear in the UI Automation tree"

  - id: snapshot-captured
    type: json_field
    source: step-10
    field: bytes
    comparison: gt
    expected: 0
    severity: critical
    description: "The UI snapshot should include non-empty screenshot bytes"

  - id: snapshot-elements-found
    type: json_field
    source: step-10
    field: element_count
    comparison: gt
    expected: 0
    severity: high
    description: "The UI snapshot should include visible UI Automation elements"

  - id: key-sent
    type: json_field
    source: step-11
    field: success
    expected: true
    severity: critical
    description: "The UI sidecar should be able to send keyboard input to the selected edit control"

pass_threshold: 1.0
critical_must_pass: true

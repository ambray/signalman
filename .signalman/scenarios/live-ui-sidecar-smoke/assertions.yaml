assertions:
  - id: sidecar-ensured
    type: json_field
    source: step-0
    field: ready
    expected: true
    severity: critical
    description: "The scenario should start or confirm the native user-session UI sidecar"

  - id: sidecar-reachable
    type: json_field
    source: step-1
    field: sidecar_reachable
    expected: true
    severity: critical
    description: "The interactive user-session UI sidecar should be reachable"

  - id: native-engine-active
    type: json_field
    source: step-1
    field: engine
    expected: native
    severity: critical
    description: "The live smoke should exercise the native UI Automation engine"

  - id: desktop-cleaned
    type: json_field
    source: step-2
    field: success
    expected: true
    severity: high
    description: "The smoke should clear any existing transient desktop UI before starting"

  - id: screenshot-captured
    type: json_field
    source: step-4
    field: bytes
    comparison: gt
    expected: 0
    severity: critical
    description: "The UI sidecar should return non-empty screenshot bytes"

  - id: screenshot-format
    type: json_field
    source: step-4
    field: format
    expected: png
    severity: high
    description: "The screenshot workflow output should identify the image format"

  - id: run-dialog-opened
    type: json_field
    source: step-5
    field: success
    expected: true
    severity: critical
    description: "The native sidecar should open the Run dialog with a Win-key chord"

  - id: run-edit-ready
    type: json_field
    source: step-6
    field: found
    expected: true
    severity: critical
    description: "The Run dialog edit control should be available before typing"

  - id: text-typed
    type: json_field
    source: step-7
    field: success
    expected: true
    severity: critical
    description: "The UI sidecar should be able to type into an explicitly selected edit control"

  - id: typed-text-observed
    type: json_field
    source: step-9
    field: elements[0].value
    expected: "signalman native smoke"
    severity: critical
    description: "The selected edit control should report the typed value through UI Automation"

  - id: typed-value-selector-found
    type: json_field
    source: step-10
    field: count
    comparison: gte
    expected: 1
    severity: critical
    description: "The typed query should be discoverable through an exact value selector"

  - id: snapshot-captured
    type: json_field
    source: step-11
    field: bytes
    comparison: gt
    expected: 0
    severity: critical
    description: "The UI snapshot should include non-empty screenshot bytes"

  - id: snapshot-elements-found
    type: json_field
    source: step-11
    field: element_count
    comparison: gt
    expected: 0
    severity: high
    description: "The UI snapshot should include visible UI Automation elements"

  - id: cancel-clicked
    type: json_field
    source: step-12
    field: success
    expected: true
    severity: critical
    description: "The UI sidecar should activate a native clickable control"

pass_threshold: 1.0
critical_must_pass: true

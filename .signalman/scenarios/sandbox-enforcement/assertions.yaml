# Sandbox Enforcement E2E — Assertions
#
# Machine-readable assertions validated after the workflow completes.
# Each assertion references a screenshot or command output from the workflow.

assertions:
  # Sandbox policy must be loaded
  - id: sandbox-policy-loaded
    type: command_output
    source: step-1
    description: "Agent log shows sandbox policy was loaded"
    expect:
      stdout_matches: "(sandbox|policy.*loaded)"
    severity: critical

  # Cursor must launch successfully
  - id: cursor-launches
    type: screenshot_check
    source: cursor-sandboxed-launch.png
    description: "Cursor IDE window is visible after launch"
    expect:
      window_visible: true
      window_title_contains: "Cursor"
    severity: critical

  # Cursor must be running in a silo
  - id: cursor-in-silo
    type: command_output
    source: step-3
    description: "Cursor process is assigned to a server silo"
    expect:
      json_field: "silo_assigned"
      json_field_equals: true
    severity: critical

  # Process enumeration must be restricted
  - id: process-enum-blocked
    type: command_output
    source: step-4
    description: "Silo'd Cursor cannot enumerate host processes"
    expect:
      json_field: "process_enumeration"
      json_field_equals: "restricted"
    severity: high

  # AI network endpoints must be blocked
  - id: network-openai-blocked
    type: command_output
    source: step-5a
    description: "OpenAI API endpoint is unreachable from sandbox"
    expect:
      stdout_contains: "False"
    severity: critical

  - id: network-cursor-api-blocked
    type: command_output
    source: step-5b
    description: "Cursor API endpoint is unreachable from sandbox"
    expect:
      stdout_contains: "False"
    severity: critical

  # Network violations must be logged
  - id: violations-logged
    type: command_output
    source: step-5c
    description: "Agent log contains sandbox network violation entries"
    expect:
      stdout_matches: "(blocked|denied|sandbox)"
    severity: medium

  # File editing must work
  - id: file-editing-works
    type: screenshot_check
    source: cursor-sandboxed-file-edit.png
    description: "Test file is open and editable in Cursor"
    expect:
      text_visible: "sandbox test"
    severity: high

  # Terminal must work
  - id: terminal-works
    type: screenshot_check
    source: cursor-sandboxed-terminal.png
    description: "Integrated terminal panel is open"
    expect:
      panel_visible: true
    severity: high

  # Silo must be cleaned up on process exit
  - id: silo-cleanup
    type: command_output
    source: step-6c
    description: "Silo was terminated and cleaned up after Cursor exited"
    expect:
      stdout_matches: "(silo.*terminated|silo.*cleanup|sandbox.*removed)"
    severity: high

# Scoring
pass_threshold: 0.75
critical_must_pass: true

[workspace]
resolver = "2"
members = [
    "guest",
    "service",
]
# The Loom plugin lives outside this workspace because it depends on Loom
# crates via path-deps. Excluding makes that explicit and keeps
# `cargo check --workspace` green when Loom is not checked out alongside.
exclude = [
    "plugins/signalman-loom-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ambray/signalman"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# gRPC
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
protoc-bin-vendored = "3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Errors
anyhow = "1"
thiserror = "1"

# Signalman runner Secret stencil — DO NOT COMMIT REAL TOKENS.
#
# Holds the Bearer token + control-plane URL the runner uses to
# authenticate against the Signalman HTTP control plane.
#
# Generate a real token via:
#   signalman api-key create --name k8s-runner-<purpose>
# Base64-encode the printed token and replace `REPLACE_ME_BASE64`.
# Commit only as `.example.yaml`; the real Secret lives in your
# operator's secret store (or apply it with `--from-literal` flags).
#
# Both the Job and the Deployment manifests reference this Secret
# via `valueFrom.secretKeyRef`, so the runner pod sees:
#   - $SIGNALMAN_RUNNER_TOKEN          (the API token, in clear)
#   - $SIGNALMAN_CONTROL_PLANE_URL     (HTTPS URL)
---
apiVersion: v1
kind: Secret
metadata:
  name: signalman-runner
  labels:
    app.kubernetes.io/name: signalman-runner
type: Opaque
stringData:
  # Replace before applying. `signalman api-key create` prints the
  # token once at creation; store it here OR (preferred) wire your
  # Secret store (External Secrets, Vault) to write this Secret on
  # rotation.
  token: REPLACE_ME_RUNNER_TOKEN
  control_plane_url: https://signalman-control-plane.example.com

# Signalman runner ServiceAccount + namespace-scoped RBAC.
#
# Grants the runner permission to:
#   - read/list/watch its own Pods + Secrets (debugging + token rotation)
#   - get/create/update its leader-election Lease (for warm-Deployment
#     futures; harmless on the one-shot Job path)
#
# Apply once per namespace. The Bearer token in `secret.example.yaml`
# is for control-plane auth (the Signalman HTTP service), separate
# from the in-cluster ServiceAccount token Kubernetes mounts at
# /var/run/secrets/kubernetes.io/serviceaccount/token.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: signalman-runner
  labels:
    app.kubernetes.io/name: signalman-runner
    app.kubernetes.io/component: scenario-runner
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: signalman-runner
  labels:
    app.kubernetes.io/name: signalman-runner
rules:
  - apiGroups: [""]
    resources: ["pods", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: signalman-runner
  labels:
    app.kubernetes.io/name: signalman-runner
subjects:
  - kind: ServiceAccount
    name: signalman-runner
roleRef:
  kind: Role
  name: signalman-runner
  apiGroup: rbac.authorization.k8s.io

# Ospiri v2 — Network Egress IOCTL Surface (scope-based, WFP-live)
#
# Sprint 60.11 C-2 + Sprint 60.8b Phase 2 commit 5. Exercises the
# OspriNet scope primitive end-to-end AND the live WFP classify
# callback:
#
#   * INIT_SCOPE / ADD_RULE / LIST_RULES / BIND_PROCESS /
#     UNBIND_PROCESS / DESTROY_SCOPE IOCTLs functional on the
#     network-egress control device
#   * V2 wire format encoder/decoder round-trips rules correctly
#   * PID -> scope binding is observable from inside the bound
#     child (child's LIST_RULES sees the same 3 rules orchestrator
#     installed)
#   * Live connect() calls from the bound worker:
#       - DENY rule target -> WFP BLOCK surfaces as WSAEACCES
#         (10013) or WSAEHOSTUNREACH (10065)
#       - ALLOW rule target -> WFP CONTINUE (no WSAEACCES)
#   * ETW emissions reach user-mode:
#       - SCOPE keyword (0x4): NetScopeCreated/Destroyed,
#         NetProcessBound/Unbound
#       - RULES keyword (0x8): NetRuleAdded, NetRulesListed
#       - ENFORCEMENT keyword (0x10): NetRuleMatched, fired by
#         the kernel classifyFn on the DENY connect()
#
# Uses the `test-signing-warm` checkpoint (running-state child of
# `test-signing-enabled`) for fast restore: ~2 s to guest-agent-
# reachable vs. 6-10+ min cold boot. See
# ospiri-v2-registry-deny/setup.yaml for the rationale + warm-
# checkpoint harvest procedure.
#
# Host-side build artifacts live in a SIBLING repository (the Ospiri
# `correlator` checkout). Set `CORRELATOR_BUILD_ROOT` to that repo's
# root before running this scenario. The default below assumes
# `correlator` and `signalman` share a parent directory; override via
# the env var when your layout differs:
#
#   $env:CORRELATOR_BUILD_ROOT = "E:\\source\\repos\\correlator"   # PowerShell
#   export CORRELATOR_BUILD_ROOT=/mnt/c/source/repos/correlator    # bash

name: "Ospiri v2 Network Egress IOCTL Surface (scope-based, WFP-live)"
version: "1.0"
tags: ["driver", "kernel", "ospiri-sys", "scope", "network", "sprint-60.11"]

vms:
  - name: endpoint-1
    template: windows-11-clean
    # Same snapshot the ospiri-driver-smoke scenario uses. No
    # Containers-feature enablement required - Phase 6 moved us to
    # a driver-owned scope primitive that works on stock Win11.
    checkpoint_restore: test-signing-warm
    guest_agent_port: 50051
    network:
      switch: "RevnTestSwitch"
      static_ip: "172.30.0.10"

setup:
  # Host-side directory tree. First post-restore command can take
  # 50-120 seconds on this VM because Hyper-V + integration services
  # are still settling; override the 60s default so the scenario
  # doesn't flake.
  - action: vm_run_command
    vm: endpoint-1
    command: powershell
    timeout_ms: 300000
    args:
      [
        "-Command",
        "New-Item -ItemType Directory -Force -Path 'C:\\Ospiri\\drv','C:\\Ospiri\\tools','C:\\Ospiri\\logs' | Out-Null",
      ]

  # Driver package (binary + catalogue + INF). Filenames stay drv.*
  # per the vcxproj name even though the deployed copy is ospiri.sys.
  - action: vm_copy_file
    vm: endpoint-1
    direction: host_to_guest
    host_path: "${CORRELATOR_BUILD_ROOT}\\docs\\drv\\x64\\Debug\\drv\\drv.sys"
    guest_path: "C:\\Ospiri\\drv\\ospiri.sys"

  - action: vm_copy_file
    vm: endpoint-1
    direction: host_to_guest
    host_path: "${CORRELATOR_BUILD_ROOT}\\docs\\drv\\x64\\Debug\\drv\\drv.cat"
    guest_path: "C:\\Ospiri\\drv\\ospiri.cat"

  - action: vm_copy_file
    vm: endpoint-1
    direction: host_to_guest
    host_path: "${CORRELATOR_BUILD_ROOT}\\docs\\drv\\x64\\Debug\\drv\\drv.inf"
    guest_path: "C:\\Ospiri\\drv\\ospiri.inf"

  # net-spawn-helper.exe - Sprint 60.11 C-2 orchestrator + worker for
  # the OspriNet egress control plane.
  # Build:
  #   cargo build --release --target x86_64-pc-windows-msvc \
  #               --package net-spawn-helper
  - action: vm_copy_file
    vm: endpoint-1
    direction: host_to_guest
    host_path: "${CORRELATOR_BUILD_ROOT}\\docs\\target\\x86_64-pc-windows-msvc\\release\\net-spawn-helper.exe"
    guest_path: "C:\\Ospiri\\tools\\net-spawn-helper.exe"

  # Register the driver service (kernel, demand-start).
  - action: vm_run_command
    vm: endpoint-1
    command: sc.exe
    args:
      ["create", "ospiri", "type=", "kernel", "start=", "demand", "binPath=", "C:\\Ospiri\\drv\\ospiri.sys"]
    run_as: SYSTEM

  - action: vm_run_command
    vm: endpoint-1
    command: sc.exe
    args: ["query", "ospiri"]
    expect_stdout: "STOPPED"

teardown:
  # Stop + delete the driver service.
  - action: vm_run_command
    vm: endpoint-1
    command: sc.exe
    args: ["stop", "ospiri"]
    ignore_exit_code: true

  - action: vm_run_command
    vm: endpoint-1
    command: sc.exe
    args: ["delete", "ospiri"]
    ignore_exit_code: true

  - action: vm_restore
    vm: endpoint-1
    checkpoint: test-signing-warm

checkpoints:
  before_test: true
  on_failure: true

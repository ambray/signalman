# Ospiri v2 — Network Egress Multi-Threaded Torture
#
# Sprint 60.8b Phase 2 commit 5. Companion to
# ospiri-v2-network-egress; that scenario proves one-shot correctness
# of the orchestrator + worker flow under the live WFP classify
# callback; this one proves the driver holds up under concurrent
# load — 16 worker threads issuing interleaved connect() calls (both
# DENY and ALLOW) alongside a mutator thread rotating rules in and
# out of the same scope.
#
# What the torture asserts (vs. the egress scenario's one-shot
# assertions):
#
#   * No WFP leaks: every DENY connect blocks (block_count ==
#     thread_count * iter_per_thread == 1600), every ALLOW connect
#     is permitted (allow_count == 1600), zero unexpected verdicts.
#   * RCU swap path correctness: LIST_RULES racing concurrent ADDs
#     never returns a short count or a torn buffer.
#   * PID->scope bind inheritance across threads works: all 16
#     worker threads see the same scope binding established by the
#     main thread, so classify callbacks route their connects to
#     the same rule table.
#   * ETW ENFORCEMENT (keyword 0x10) events continue to flow under
#     concurrent load — no drops.
#
# Uses the `test-signing-warm` checkpoint (running-state child of
# `test-signing-enabled`) for fast restore. See
# ospiri-v2-network-egress/setup.yaml for rationale.

name: "Ospiri v2 Network Egress Multi-Threaded Torture (16 threads x 100 iter)"
version: "1.0"
tags: ["driver", "kernel", "ospiri-sys", "scope", "network", "torture", "wfp", "sprint-60.8b"]

vms:
  - name: endpoint-1
    template: windows-11-clean
    checkpoint_restore: test-signing-warm
    guest_agent_port: 50051
    network:
      switch: "RevnTestSwitch"
      static_ip: "172.30.0.10"

setup:
  # First post-restore command can take 50-120 seconds on this VM
  # while Hyper-V + integration services settle. Override the 60s
  # default so the scenario doesn't flake.
  - action: vm_run_command
    vm: endpoint-1
    command: powershell
    timeout_ms: 300000
    args:
      [
        "-Command",
        "New-Item -ItemType Directory -Force -Path 'C:\\Ospiri\\drv','C:\\Ospiri\\tools','C:\\Ospiri\\logs' | Out-Null",
      ]

  # Driver package (same binary as the egress scenario).
  - action: vm_copy_file
    vm: endpoint-1
    direction: host_to_guest
    host_path: "E:\\source\\repos\\correlator\\docs\\drv\\x64\\Debug\\drv\\drv.sys"
    guest_path: "C:\\Ospiri\\drv\\ospiri.sys"

  - action: vm_copy_file
    vm: endpoint-1
    direction: host_to_guest
    host_path: "E:\\source\\repos\\correlator\\docs\\drv\\x64\\Debug\\drv\\drv.cat"
    guest_path: "C:\\Ospiri\\drv\\ospiri.cat"

  - action: vm_copy_file
    vm: endpoint-1
    direction: host_to_guest
    host_path: "E:\\source\\repos\\correlator\\docs\\drv\\x64\\Debug\\drv\\drv.inf"
    guest_path: "C:\\Ospiri\\drv\\ospiri.inf"

  # net-spawn-helper-torture.exe - Sprint 60.8b Phase 2 commit 5
  # multi-threaded torture harness.
  # Build:
  #   cargo build --release --target x86_64-pc-windows-msvc \
  #               --package net-spawn-helper-torture
  - action: vm_copy_file
    vm: endpoint-1
    direction: host_to_guest
    host_path: "E:\\source\\repos\\correlator\\docs\\target\\x86_64-pc-windows-msvc\\release\\net-spawn-helper-torture.exe"
    guest_path: "C:\\Ospiri\\tools\\net-spawn-helper-torture.exe"

  # Register the driver service (kernel, demand-start).
  - action: vm_run_command
    vm: endpoint-1
    command: sc.exe
    args:
      ["create", "ospiri", "type=", "kernel", "start=", "demand", "binPath=", "C:\\Ospiri\\drv\\ospiri.sys"]
    run_as: SYSTEM

  - action: vm_run_command
    vm: endpoint-1
    command: sc.exe
    args: ["query", "ospiri"]
    expect_stdout: "STOPPED"

teardown:
  - action: vm_run_command
    vm: endpoint-1
    command: sc.exe
    args: ["stop", "ospiri"]
    ignore_exit_code: true

  - action: vm_run_command
    vm: endpoint-1
    command: sc.exe
    args: ["delete", "ospiri"]
    ignore_exit_code: true

  - action: vm_restore
    vm: endpoint-1
    checkpoint: test-signing-warm

checkpoints:
  before_test: true
  on_failure: true

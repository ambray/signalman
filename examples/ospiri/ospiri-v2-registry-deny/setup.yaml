# Ospiri v2 — Registry Rule Deny (scope-based enforcement)
#
# Sprint 60.8a Phase 6. Exercises the OspriReg scope primitive
# end-to-end:
#
#   * INIT_SCOPE / ADD_RULE / LIST_RULES / BIND_PROCESS / DESTROY_SCOPE
#     IOCTLs functional
#   * CM callback looks up the caller's PID in the scope map
#   * A DENY+PREFIX rule blocks RegCreateKey on the denied path
#     (ERROR_ACCESS_DENIED from user-mode)
#   * Non-matching paths still succeed (no false positives)
#
# **No dependency on Windows Containers feature.** Our driver's
# scope primitive is a driver-owned hash table; no kernel silo is
# ever created. Works on every Windows 10/11 SKU that can load a
# test-signed driver.
#
# Uses the `test-signing-warm` checkpoint (child of
# `test-signing-enabled`). The warm checkpoint was taken while the
# VM was Running with the guest agent stable + all Hyper-V integration
# services reporting OK + PowerShell JIT-warmed. Restoring it returns
# in ~2 s with PowerShell responding in ~300 ms on first call.
# Cold `test-signing-enabled` checkpoint on a fresh host can take
# 6-10+ min to become fully responsive (PowerShell first-call cold
# start alone measured at 101 s in the worst case). See
# `feedback_vm_smoke_after_every_phase.md` for the harvest procedure
# on a fresh machine.
#
# Host-side build artifacts live in a SIBLING repository (the Ospiri
# `correlator` checkout). Set `CORRELATOR_BUILD_ROOT` to that repo's
# root before running this scenario. The default below assumes
# `correlator` and `signalman` share a parent directory; override via
# the env var when your layout differs:
#
#   $env:CORRELATOR_BUILD_ROOT = "E:\\source\\repos\\correlator"   # PowerShell
#   export CORRELATOR_BUILD_ROOT=/mnt/c/source/repos/correlator    # bash

name: "Ospiri v2 Registry Rule Deny (scope-based)"
version: "1.0"
tags: ["driver", "kernel", "ospiri-sys", "scope", "registry", "sprint-60.8a"]

vms:
  - name: endpoint-1
    template: windows-11-clean
    # Same snapshot the ospiri-driver-smoke scenario uses. No
    # Containers-feature enablement required - Phase 6 moved us to
    # a driver-owned scope primitive that works on stock Win11.
    checkpoint_restore: test-signing-warm
    guest_agent_port: 50051
    network:
      switch: "RevnTestSwitch"
      static_ip: "172.30.0.10"

setup:
  # Host-side directory tree. First post-restore command can take
  # 50-120 seconds on this VM because Hyper-V + integration services
  # are still settling; override the 60s default so the scenario
  # doesn't flake.
  - action: vm_run_command
    vm: endpoint-1
    command: powershell
    timeout_ms: 300000
    args:
      [
        "-Command",
        "New-Item -ItemType Directory -Force -Path 'C:\\Ospiri\\drv','C:\\Ospiri\\tools','C:\\Ospiri\\logs' | Out-Null",
      ]

  # Driver package (binary + catalogue + INF). Filenames stay drv.*
  # per the vcxproj name even though the deployed copy is ospiri.sys.
  - action: vm_copy_file
    vm: endpoint-1
    direction: host_to_guest
    host_path: "${CORRELATOR_BUILD_ROOT}\\docs\\drv\\x64\\Debug\\drv\\drv.sys"
    guest_path: "C:\\Ospiri\\drv\\ospiri.sys"

  - action: vm_copy_file
    vm: endpoint-1
    direction: host_to_guest
    host_path: "${CORRELATOR_BUILD_ROOT}\\docs\\drv\\x64\\Debug\\drv\\drv.cat"
    guest_path: "C:\\Ospiri\\drv\\ospiri.cat"

  - action: vm_copy_file
    vm: endpoint-1
    direction: host_to_guest
    host_path: "${CORRELATOR_BUILD_ROOT}\\docs\\drv\\x64\\Debug\\drv\\drv.inf"
    guest_path: "C:\\Ospiri\\drv\\ospiri.inf"

  # silo-spawn-helper.exe - Phase 6 scope-based orchestrator + worker.
  # Build:
  #   cargo build --release --target x86_64-pc-windows-msvc \
  #               --package silo-spawn-helper
  # The binary name retains "silo" for backward compat with Phase 5
  # scripts; Phase 6 merely replaced the semantics (not the name).
  - action: vm_copy_file
    vm: endpoint-1
    direction: host_to_guest
    host_path: "${CORRELATOR_BUILD_ROOT}\\docs\\target\\x86_64-pc-windows-msvc\\release\\silo-spawn-helper.exe"
    guest_path: "C:\\Ospiri\\tools\\silo-spawn-helper.exe"

  # Register the driver service (kernel, demand-start).
  - action: vm_run_command
    vm: endpoint-1
    command: sc.exe
    args:
      ["create", "ospiri", "type=", "kernel", "start=", "demand", "binPath=", "C:\\Ospiri\\drv\\ospiri.sys"]
    run_as: SYSTEM

  - action: vm_run_command
    vm: endpoint-1
    command: sc.exe
    args: ["query", "ospiri"]
    expect_stdout: "STOPPED"

teardown:
  # Stop + delete the driver service.
  - action: vm_run_command
    vm: endpoint-1
    command: sc.exe
    args: ["stop", "ospiri"]
    ignore_exit_code: true

  - action: vm_run_command
    vm: endpoint-1
    command: sc.exe
    args: ["delete", "ospiri"]
    ignore_exit_code: true

  # Scrub any OspiriV2Reg* keys the worker may have left behind.
  - action: vm_run_command
    vm: endpoint-1
    command: reg.exe
    args: ["delete", "HKLM\\Software\\OspiriV2RegDeny", "/f"]
    ignore_exit_code: true

  - action: vm_run_command
    vm: endpoint-1
    command: reg.exe
    args: ["delete", "HKLM\\Software\\OspiriV2RegAllow", "/f"]
    ignore_exit_code: true

  - action: vm_restore
    vm: endpoint-1
    checkpoint: test-signing-warm

checkpoints:
  before_test: true
  on_failure: true

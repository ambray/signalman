[package]
name = "signalman-guest"
version = "0.2.1"
edition = "2021"
description = "Signalman guest agent — process control, UI automation, and network/file-access probes inside VMs"
license = "Apache-2.0"
repository = "https://github.com/ambray/signalman"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# gRPC
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Process registry
rand = "0.8"

# SHA-256 for client-cert pinning (B2 / Sec F1 Critical mitigation).
# We use sha2 + hex rather than ring directly because ring is a heavy
# crypto framework dep — pulling it for a single hash would be a dep
# bloat regression. sha2 is a small, well-audited primitive.
sha2 = "0.10"
hex = "0.4"

# Networking (for restriction verification)
# P9.2: `stream` feature for chunked download + SHA verification in
# install_direct (avoids loading multi-GB installers into memory).
reqwest = { version = "0.12", features = ["rustls-tls", "stream"], default-features = false }
# futures-util's `StreamExt` is what gives us `.next().await` on the
# `bytes_stream()` reqwest returns.
futures-util = "0.3"

# Screenshot
image = { version = "0.25", optional = true }

# Windows-specific
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
windows-core = "0.58"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dev-dependencies]
# Self-signed cert generation for mTLS integration tests
rcgen = "0.13"
# Adapt a tokio TcpListener to a Stream so the integration server can
# bind a random port without leaving an open TcpListener around.
tokio-stream = { version = "0.1", features = ["net"] }

[features]
default = ["screenshot"]
screenshot = ["image"]

# ── cargo-wix configuration (P9.1) ─────────────────────────────────
#
# Tells `cargo wix` where to find the hand-rolled product.wxs file
# rather than generating one. Run from the workspace root:
#
#   cargo wix --package signalman-guest
#
# Output lands at `target/wix/signalman-guest-<version>-<arch>.msi`.
# The host provisioner discovers it via the chain documented in
# `host/src/provisioning/guest-msi-discovery.ts`.
[package.metadata.wix]
# Path is relative to this Cargo.toml.
path = "wix/product.wxs"
# Compression: high gives a smaller MSI at the cost of build time.
# Acceptable here — guest agent builds aren't on the hot path.
compression-level = "high"
# Include the WiX UtilExtension (used by ServiceConfig) and the
# FirewallExtension (inbound port-50051 rule). cargo-wix maps these
# to candle/light's `-ext` flags.
include = [
    "WixUtilExtension",
    "WixFirewallExtension",
]

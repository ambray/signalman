[package]
name = "signalman-guest"
version = "0.1.0"
edition = "2021"
description = "Signalman guest agent — process control, UI automation, and restriction verification inside VMs"
license = "MIT"
repository = "https://github.com/nickthecook/signalman"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# gRPC
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Process registry
rand = "0.8"

# SHA-256 for client-cert pinning (B2 / Sec F1 Critical mitigation).
# We use sha2 + hex rather than ring directly because ring is a heavy
# crypto framework dep — pulling it for a single hash would be a dep
# bloat regression. sha2 is a small, well-audited primitive.
sha2 = "0.10"
hex = "0.4"

# Networking (for restriction verification)
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }

# Screenshot
image = { version = "0.25", optional = true }

# Windows-specific
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Gdi",
] }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dev-dependencies]
# Self-signed cert generation for mTLS integration tests
rcgen = "0.13"
# Adapt a tokio TcpListener to a Stream so the integration server can
# bind a random port without leaving an open TcpListener around.
tokio-stream = { version = "0.1", features = ["net"] }

[features]
default = ["screenshot"]
screenshot = ["image"]

syntax = "proto3";

package signalman.guest;

// Guest Agent gRPC service — runs inside each VM.
// The host MCP server calls these RPCs to control processes,
// automate UI, and verify restrictions.
//
// ── v1 freeze (P8, 2026-04-26) ─────────────────────────────────────
// This file is the v1 contract. Field numbers are STABLE; renames
// require a coordinated host TS + guest Rust + service Rust + plugin
// migration. Windows-only details are split into per-platform `oneof`
// variants so adding Linux/macOS guest agents does NOT require a
// breaking field renumbering — the variant is a free addition.
//
// Width compatibility: trace IDs that ride alongside this proto on
// gRPC metadata (`signalman-trace-id`) are 32 hex chars to match
// W3C `trace-id` width, keeping the OTel-upgrade path cheap.

service GuestAgent {
  // ── Health ──────────────────────────────────────────────────
  rpc Health(HealthRequest) returns (HealthResponse);

  // Server-streaming readiness signal. Reserved for the cold-boot
  // wait path (orchestrator.waitForGuestAgents). v0.1.0 keeps the
  // poll-based path; this RPC is the future-readiness slot so we
  // do not need another proto bump to add it. Implementations are
  // free to return UNIMPLEMENTED until a real consumer arrives.
  rpc StreamReadiness(StreamReadinessRequest) returns (stream ReadinessUpdate);

  // ── Registration ────────────────────────────────────────────
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // ── Process Control ─────────────────────────────────────────
  rpc ProcessStart(ProcessStartRequest) returns (ProcessStartResponse);
  rpc ProcessStop(ProcessStopRequest) returns (ProcessStopResponse);
  rpc ProcessList(ProcessListRequest) returns (ProcessListResponse);
  rpc ProcessInspect(ProcessInspectRequest) returns (ProcessInspectResponse);

  // ── Command Execution ───────────────────────────────────────
  rpc RunCommand(RunCommandRequest) returns (RunCommandResponse);

  // ── UI Automation ───────────────────────────────────────────
  rpc UIClick(UIClickRequest) returns (UIActionResponse);
  rpc UIType(UITypeRequest) returns (UIActionResponse);
  rpc UIKey(UIKeyRequest) returns (UIActionResponse);
  rpc UIFind(UIFindRequest) returns (UIFindResponse);
  rpc UIScreenshot(UIScreenshotRequest) returns (UIScreenshotResponse);

  // ── Browser Automation ──────────────────────────────────────
  rpc BrowserNavigate(BrowserNavigateRequest) returns (BrowserActionResponse);
  rpc BrowserClick(BrowserClickRequest) returns (BrowserActionResponse);
  rpc BrowserScreenshot(BrowserScreenshotRequest) returns (BrowserScreenshotResponse);

  // ── Restriction Verification ────────────────────────────────
  rpc VerifyRestriction(VerifyRestrictionRequest) returns (VerifyRestrictionResponse);
  rpc TestNetwork(TestNetworkRequest) returns (TestNetworkResponse);
  rpc TestFileAccess(TestFileAccessRequest) returns (TestFileAccessResponse);

  // ── File Operations ────────────────────────────────────────────
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);

  // ── Software Management ─────────────────────────────────────
  rpc InstallSoftware(InstallSoftwareRequest) returns (InstallSoftwareResponse);

  // P9.2 — multi-source bundle installs. Sources that need
  // installer-shape parameters (URL + SHA + silent args) or
  // container-shape parameters (image digest + ports + env) get their
  // own RPC rather than overloading InstallSoftwareRequest, which
  // stays package-manager-shaped (package_id + source + version).
  rpc InstallDirect(InstallDirectRequest) returns (InstallSoftwareResponse);
  rpc InstallDocker(InstallDockerRequest) returns (InstallSoftwareResponse);
}

// ── Health ────────────────────────────────────────────────────────

message HealthRequest {}

message HealthResponse {
  string hostname = 1;
  string os = 2;
  string os_version = 3;
  string agent_version = 4;
  uint64 uptime_seconds = 5;
  repeated string capabilities = 6;  // e.g., ["process", "ui", "browser", "verify"]
}

// ── Readiness Stream (P8 future-readiness slot) ───────────────────

message StreamReadinessRequest {
  // Optional client-side identifier for log correlation. Empty is OK.
  string client_id = 1;
}

message ReadinessUpdate {
  // Lifecycle state of the guest agent.
  // "starting" | "ready" | "degraded" | "stopping"
  string state = 1;
  // Human-readable detail line; safe to log verbatim.
  string detail = 2;
  // Monotonic counter so a slow consumer can detect dropped updates.
  uint64 sequence = 3;
}

// ── Registration ──────────────────────────────────────────────────

message RegisterRequest {
  string hub_url = 1;
  string hostname = 2;
  string os = 3;
  repeated string capabilities = 4;
  uint32 grpc_port = 5;
}

message RegisterResponse {
  string agent_id = 1;
  bool accepted = 2;
}

// ── Process Control ───────────────────────────────────────────────

message ProcessStartRequest {
  string path = 1;
  repeated string args = 2;
  string working_directory = 3;
  map<string, string> env = 4;
  bool wait_for_exit = 5;
  uint32 timeout_ms = 6;
  // Privilege context: "" = current user (default), "SYSTEM" = LocalSystem
  string run_as = 7;
}

message ProcessStartResponse {
  uint32 pid = 1;
  bool started = 2;
  string error = 3;
  // If wait_for_exit was true:
  int32 exit_code = 4;
  string stdout = 5;
  string stderr = 6;
}

message ProcessStopRequest {
  uint32 pid = 1;
  string process_name = 2;  // Alternative: stop by name
  bool force = 3;
}

message ProcessStopResponse {
  bool stopped = 1;
  string error = 2;
}

message ProcessListRequest {
  string name_filter = 1;  // Optional: filter by process name
}

// Process info — cross-platform in fields 1–7; OS-specific token /
// container details live in `platform_details` (P8). Linux and macOS
// guests fill in the matching variant when they ship; until then their
// variants are empty placeholders that lock the field tags.
message ProcessInfo {
  uint32 pid = 1;
  string name = 2;
  string path = 3;
  string command_line = 4;
  uint64 memory_bytes = 5;
  double cpu_percent = 6;
  string user = 7;

  // P8: tags 8–11 previously held flat Windows-specific token info
  // (is_appcontainer, appcontainer_sid, is_low_integrity, is_in_job).
  // They moved into `WindowsProcessDetails` under the platform_details
  // oneof. Reserved here so a future field cannot accidentally reuse
  // a tag and confuse old binaries on the wire.
  reserved 8 to 11;
  reserved "is_appcontainer", "appcontainer_sid", "is_low_integrity", "is_in_job";

  oneof platform_details {
    WindowsProcessDetails windows = 100;
    LinuxProcessDetails linux = 101;
    MacOsProcessDetails macos = 102;
  }
}

message WindowsProcessDetails {
  bool is_appcontainer = 1;
  string appcontainer_sid = 2;
  bool is_low_integrity = 3;
  bool is_in_job = 4;
}

message LinuxProcessDetails {
  // Reserved for future Linux guest agents. Likely fields:
  //   string cgroup_path = 1;
  //   repeated string namespaces = 2;
  //   repeated string capabilities_effective = 3;
  // Empty for now to lock the variant tag.
}

message MacOsProcessDetails {
  // Reserved for future macOS guest agents. Likely fields:
  //   string sandbox_profile = 1;
  //   string code_signing_team_id = 2;
  // Empty for now to lock the variant tag.
}

message ProcessListResponse {
  repeated ProcessInfo processes = 1;
}

message ProcessInspectRequest {
  uint32 pid = 1;
}

// Detailed process inspection. Cross-platform fields are common
// privileges/groups; deep token / job / container info is per-platform.
message ProcessInspectResponse {
  ProcessInfo process = 1;

  // Cross-platform fields kept flat:
  //   privileges: Win32 privilege names OR Linux capability names; the
  //               value is opaque to the protocol — implementations
  //               choose their convention.
  //   groups:     OS group names; format is platform-defined.
  repeated string privileges = 3;
  repeated string groups = 4;
  // Network-restriction observations (cross-platform); empty when
  // not applicable.
  repeated string blocked_domains = 9;
  repeated string allowed_domains = 10;

  // P8: tags 2 and 5–8 previously held flat Windows token / AppContainer
  // / Job details (integrity_level, appcontainer_name, capabilities,
  // job_name, job_memory_limit). They moved into the platform_details
  // oneof.
  reserved 2, 5, 6, 7, 8;
  reserved "integrity_level", "appcontainer_name", "capabilities",
           "job_name", "job_memory_limit";

  oneof platform_details {
    WindowsInspectDetails windows = 100;
    LinuxInspectDetails linux = 101;
    MacOsInspectDetails macos = 102;
  }
}

message WindowsInspectDetails {
  // Token integrity ("Low" | "Medium" | "High" | "System").
  string integrity_level = 1;
  // AppContainer details.
  string appcontainer_name = 2;
  repeated string appcontainer_capabilities = 3;
  // Job-object details.
  string job_name = 4;
  uint64 job_memory_limit = 5;
}

message LinuxInspectDetails {
  // Reserved for future use; empty for now.
}

message MacOsInspectDetails {
  // Reserved for future use; empty for now.
}

// ── Command Execution ─────────────────────────────────────────────

message RunCommandRequest {
  string command = 1;
  repeated string args = 2;
  string working_directory = 3;
  uint32 timeout_ms = 4;
  bool capture_output = 5;
  // Privilege context: "" = current user (default), "SYSTEM" = LocalSystem
  string run_as = 6;
}

message RunCommandResponse {
  int32 exit_code = 1;
  string stdout = 2;
  string stderr = 3;
  uint64 duration_ms = 4;
}

// ── UI Automation ─────────────────────────────────────────────────

message UIClickRequest {
  string selector = 1;  // UIA selector: "[name='Save']", "[automationId='btn1']"
  string window_title = 2;  // Optional: target window
  string click_type = 3;  // "left", "right", "double"
}

message UITypeRequest {
  string text = 1;
  string selector = 2;  // Optional: target element
  string window_title = 3;
  bool clear_first = 4;
}

message UIKeyRequest {
  string keys = 1;  // SendKeys syntax: "{ENTER}", "{ESC}", "^{A}", etc.
  string selector = 2;  // Optional: target element to focus first
  string window_title = 3;
  uint32 repeat = 4;  // Defaults to 1
}

message UIFindRequest {
  string selector = 1;
  string window_title = 2;
  uint32 timeout_ms = 3;
}

message UIElement {
  string name = 1;
  string automation_id = 2;
  string control_type = 3;
  string class_name = 4;
  bool is_enabled = 5;
  bool is_visible = 6;
  int32 x = 7;
  int32 y = 8;
  int32 width = 9;
  int32 height = 10;
  string value = 11;
}

message UIFindResponse {
  repeated UIElement elements = 1;
  uint64 duration_ms = 2;
}

message UIActionResponse {
  bool success = 1;
  string error = 2;
  uint64 duration_ms = 3;
}

message UIScreenshotRequest {
  string window_title = 1;  // Optional: specific window, or full desktop
  string format = 2;  // "png" or "jpeg"
}

message UIScreenshotResponse {
  bytes image_data = 1;
  string format = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint64 duration_ms = 5;
}

// ── Browser Automation ────────────────────────────────────────────

message BrowserNavigateRequest {
  string url = 1;
  uint32 timeout_ms = 2;
}

message BrowserClickRequest {
  string css_selector = 1;
  uint32 timeout_ms = 2;
}

message BrowserActionResponse {
  bool success = 1;
  string error = 2;
  string page_title = 3;
  string page_url = 4;
}

message BrowserScreenshotRequest {
  string format = 1;
  bool full_page = 2;
}

message BrowserScreenshotResponse {
  bytes image_data = 1;
  string format = 2;
  uint32 width = 3;
  uint32 height = 4;
}

// ── Restriction Verification ──────────────────────────────────────

message VerifyRestrictionRequest {
  uint32 pid = 1;
  string process_name = 2;  // Alternative: find by name
}

// Restriction verdict — cross-platform top-level result + per-platform
// evidence in the platform_details oneof.
message VerifyRestrictionResponse {
  // Cross-platform top-level fields:
  bool is_restricted = 1;
  // Free-form verdict label. Recognised values today:
  //   "fully_restricted" | "partially_restricted" | "not_restricted"
  string verdict = 12;
  repeated string issues = 13;
  // Network-egress observations (cross-platform).
  bool has_firewall_rules = 8;
  repeated string blocked_domains = 9;

  // P8: tags 2–7, 10–11 previously held flat Windows-specific evidence
  // (restriction_mode, has_appcontainer_token, appcontainer_sid,
  // is_low_integrity, is_in_job, job_name, has_restrict_dll,
  // restrict_dll_path). They moved into WindowsRestrictionDetails.
  reserved 2, 3, 4, 5, 6, 7, 10, 11;
  reserved "restriction_mode", "has_appcontainer_token",
           "appcontainer_sid", "is_low_integrity", "is_in_job",
           "job_name", "has_restrict_dll", "restrict_dll_path";

  oneof platform_details {
    WindowsRestrictionDetails windows = 100;
    LinuxRestrictionDetails linux = 101;
    MacOsRestrictionDetails macos = 102;
  }
}

message WindowsRestrictionDetails {
  // Restriction mode the agent observed.
  // Values: "AppContainer" | "Legacy" | "None"
  string restriction_mode = 1;
  // AppContainer-token observations.
  bool has_appcontainer_token = 2;
  string appcontainer_sid = 3;
  bool is_low_integrity = 4;
  // Job-object observations.
  bool is_in_job = 5;
  string job_name = 6;
  // DLL-injection-based restriction observations (e.g. RestrictDll).
  bool has_restrict_dll = 7;
  string restrict_dll_path = 8;
}

message LinuxRestrictionDetails {
  // Reserved for future use; empty for now.
}

message MacOsRestrictionDetails {
  // Reserved for future use; empty for now.
}

message TestNetworkRequest {
  string host = 1;
  uint32 port = 2;
  string protocol = 3;  // "tcp", "udp", "https"
  uint32 timeout_ms = 4;
}

message TestNetworkResponse {
  bool reachable = 1;
  uint64 latency_ms = 2;
  string error = 3;
  string tls_info = 4;  // TLS version, cipher, cert info
}

message TestFileAccessRequest {
  string path = 1;
  string operation = 2;  // "read", "write", "delete", "list"
}

message TestFileAccessResponse {
  bool allowed = 1;
  string error = 2;
  // Platform-defined error code. On Windows this is the Win32 error
  // (e.g. "5" = access denied); on Linux it would be the errno
  // ("EACCES") or syscall name. The protocol does not interpret it.
  string error_code = 3;
}

// ── File Operations ───────────────────────────────────────────────

message ReadFileRequest {
  string path = 1;
  uint64 offset = 2;
  // 0 means read to EOF, capped by the guest agent.
  uint64 limit = 3;
}

message ReadFileResponse {
  bytes data = 1;
  bool truncated = 2;
}

message WriteFileRequest {
  string path = 1;
  bytes data = 2;
  bool append = 3;
}

message WriteFileResponse {
  uint64 bytes_written = 1;
}

message ListDirectoryRequest {
  string path = 1;
}

message DirectoryEntry {
  string name = 1;
  uint64 size = 2;
  bool is_dir = 3;
  uint64 modified_unix_secs = 4;
}

message ListDirectoryResponse {
  repeated DirectoryEntry entries = 1;
}

// ── Software Management ───────────────────────────────────────────

message InstallSoftwareRequest {
  string package_id = 1;
  // Source is one of:
  //   "winget"   — Windows Package Manager (default Windows source)
  //   "choco"    — Chocolatey
  //   "msstore"  — Microsoft Store (routed via `winget install --source msstore`)
  // Use the dedicated InstallDirect / InstallDocker RPCs for sources
  // whose parameter shape doesn't fit (url+sha vs image+digest).
  string source = 2;
  string version = 3;  // Optional: specific version
  bool silent = 4;
}

message InstallSoftwareResponse {
  bool success = 1;
  int32 exit_code = 2;
  string stdout = 3;
  string stderr = 4;
  string installed_path = 5;
  // P9.2: when an idempotent re-run detects the package was already
  // present, the guest sets this true and exit_code = 0. Bundle
  // orchestrator counts these as "skipped" rather than "installed".
  bool already_installed = 6;
}

// P9.2 — direct installer download. Guest fetches the URL over HTTPS,
// verifies SHA-256, then spawns the installer with the supplied args.
message InstallDirectRequest {
  // Stable identifier for logging / dedup (matches bundle entry id).
  string id = 1;
  // HTTPS URL of the installer. Guest enforces https:// scheme.
  string url = 2;
  // 64-char lowercase hex SHA-256 of the installer bytes. REQUIRED.
  // Guest hard-fails if computed digest does not match.
  string sha256 = 3;
  // Silent-install arguments for the installer (e.g. ["/SILENT", "/NORESTART"]).
  repeated string args = 4;
  // Optional: expected install directory. Guest does NOT enforce; the
  // value travels through to the response so the orchestrator can log
  // it for the user.
  string install_dir = 5;
  // Per-call timeout in milliseconds. Zero = service-default (5 min).
  uint64 timeout_ms = 6;
}

// P9.2 — docker container install. Guest pulls the image (digest-pinned),
// runs it with the supplied options. Requires Docker on the VM (operator
// orders that prerequisite explicitly in the bundle).
message InstallDockerRequest {
  // Stable identifier for logging / dedup.
  string id = 1;
  // Image reference WITHOUT digest (e.g. "mailhog/mailhog").
  // Guest pulls `<image>@<image_sha256>` so the digest pin is
  // load-bearing. Tag-only references are rejected.
  string image = 2;
  // Image digest pin — `sha256:<64hex>` form. REQUIRED.
  string image_sha256 = 3;
  // Optional container name. Empty = docker-generated.
  string container_name = 4;
  // Port forwards in `host:container` form (e.g. "1025:1025").
  repeated string ports = 5;
  // Environment variables to set inside the container.
  map<string, string> env = 6;
  // One of "no" | "always" | "unless-stopped" | "on-failure".
  // Empty defaults to "unless-stopped" per host-side schema.
  string restart_policy = 7;
  // Override the image entrypoint args. Empty = image default.
  repeated string command = 8;
  // Per-call timeout in milliseconds. Zero = service-default (5 min).
  uint64 timeout_ms = 9;
}

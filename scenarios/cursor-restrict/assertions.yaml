# Cursor Restrict Scenario — Assertions
#
# Machine-readable assertions validated after the workflow completes.
# Each assertion references a screenshot or command output from the workflow.

assertions:
  # AI network endpoints must be blocked
  - id: network-openai-blocked
    type: command_output
    source: step-5a
    description: "OpenAI API endpoint is unreachable"
    expect:
      stdout_contains: "False"
    severity: critical

  - id: network-cursor-api-blocked
    type: command_output
    source: step-5a
    description: "Cursor API endpoint is unreachable"
    expect:
      stdout_contains: "False"
    severity: critical

  # Cursor must launch successfully
  - id: cursor-launches
    type: screenshot_check
    source: cursor-launched.png
    description: "Cursor IDE window is visible after launch"
    expect:
      window_visible: true
      window_title_contains: "Cursor"
    severity: critical

  # File editing must work
  - id: file-editing-works
    type: screenshot_check
    source: cursor-file-open.png
    description: "Test file is open in the editor"
    expect:
      text_visible: "hello world"
    severity: high

  # AI completion must NOT appear
  - id: no-ai-completion
    type: screenshot_check
    source: cursor-no-completion.png
    description: "No AI inline completion visible"
    expect:
      text_not_visible: ["ghost text", "AI suggestion"]
      no_overlay_popup: true
    severity: critical

  # Terminal works
  - id: terminal-works
    type: screenshot_check
    source: cursor-terminal.png
    description: "Integrated terminal panel is open"
    expect:
      panel_visible: true
    severity: high

  # Restriction violations logged
  - id: violations-logged
    type: command_output
    source: step-5c
    description: "Agent log contains restriction violation entries"
    expect:
      stdout_matches: "(violation|blocked|restrict)"
    severity: medium

  # Process is restricted
  - id: process-restricted
    type: command_output
    source: step-7
    description: "Cursor process is running under restriction"
    expect:
      json_field: "decision"
      json_field_not_equals: "allow"
    severity: high

# Scoring
pass_threshold: 0.75    # 75% of assertions must pass
critical_must_pass: true # All critical assertions must pass

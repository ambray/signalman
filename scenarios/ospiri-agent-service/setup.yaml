# Example Agent Service Validation Scenario -- Setup & Configuration
#
# Migrated from: correlator/tests/vm/Invoke-AgentServiceValidation.ps1
# Validates the 10 core agent service checks:
#   1. Service exists (installed via MSI)
#   2. Service is running
#   3. ETW session is active
#   4. Agent logs are generated
#   5. Process detection (stub claude.exe)
#   6. DNS detection (resolve known AI domains)
#   7. Backend registration (/api/v1/endpoints)
#   8. Heartbeat flowing
#   9. Telemetry upload (AI tools in backend)
#  10. Service lifecycle (stop + restart)

name: "Example Agent Service Validation"
version: "1.0"
tags: ["agent", "service", "etw", "detection", "backend", "lifecycle"]

# VM configuration
vms:
  - name: endpoint-1
    template: windows-11-clean
    # checkpoint_restore: DetectionValidated  # disabled: requires VM off + no auto-checkpoints
    guest_agent_port: 50051
    network:
      switch: "RevnTestSwitch"
      static_ip: "172.30.0.10"

# Pre-test setup (agent is already installed via checkpoint)
setup:
  # Warm PowerShell (first pwsh cold-start on fresh VM can take 10-20s).
  # Do a trivial call first so later 10s-budget commands have a warm cache.
  - action: vm_run_command
    vm: endpoint-1
    command: powershell
    args: ["-Command", "1"]
    timeout_ms: 30000

  # Verify agent binary exists
  - action: vm_run_command
    vm: endpoint-1
    command: powershell
    args: ["-Command", "Test-Path 'C:\\Example\\example-agent.exe'"]
    timeout_ms: 30000

# Workflow is defined in workflow.md

# Post-test teardown
teardown:
  # Clean up stub processes and files
  - action: vm_run_command
    vm: endpoint-1
    command: powershell
    args: ["-Command", "Stop-Process -Name 'claude' -Force -ErrorAction SilentlyContinue; Remove-Item 'C:\\example-stubs' -Recurse -Force -ErrorAction SilentlyContinue"]
    timeout_ms: 10000

  # Restore to clean checkpoint
  - action: vm_restore
    vm: endpoint-1
    checkpoint: DetectionValidated

# Checkpoint strategy
checkpoints:
  before_test: true
  on_failure: true

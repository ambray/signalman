# Example v2 Registry Rule Deny — Assertions
#
# Sprint 60.8a Phase 6 (scope-based enforcement), Phase 7 verification.
#
# The workflow.md tool blocks carry inline `expect_exit_code` /
# `expect_status` params that fail the tool-block on mismatch. Those
# failures already mark the scenario FAILED at the orchestrator level.
# However the CLI/XML reporter only surfaces named assertions, so we
# also add one explicit assertion per workflow step to get per-step
# pass/fail visibility in the JUnit report.
#
# step indexing (parsed from workflow.md by signalman):
#   step-0: driver_load
#   step-1: vm_run_command (silo-spawn-helper orchestrator)
#   step-2: driver_ioctl (DRAIN_EVIDENCE)
#   step-3: driver_unload
#
# step-1 is the meat: silo-spawn-helper exits 0 only when every IOCTL
# succeeded AND the worker also exited 0 (denied path -> ERROR_ACCESS_DENIED,
# allowed path -> ERROR_SUCCESS). Its stderr contains a "matched=true"
# line from the worker summary when all sub-steps passed.

assertions:
  # Note on assertion type choice: signalman's V2 evaluator's
  # `exit_code` type reads `CommandResult.exitCode` (camelCase) but the
  # orchestrator's workflow→CommandResult adapter writes `exit_code`
  # (snake_case), so `exit_code` assertions never match for workflow
  # tool-blocks. `stdout_contains` is the reliable path — workflow tool
  # blocks capture their stdout verbatim into the source map, and any
  # inline `expect_exit_code` on the tool block itself already fails
  # the block before we even reach this assertion pass.
  #
  # Step map (parsed from workflow.md):
  #   step-0: driver_load (stdout = JSON {status, service_state, ...})
  #   step-1: silo-spawn-helper orchestrator (stdout empty; its
  #           inline expect_exit_code: 0 is the assertion — any non-zero
  #           exit throws the tool block, marking the scenario failed)
  #   step-2: Get-Content silo-spawn-worker.json (worker JSON report)
  #   step-3: driver_unload (stdout = JSON {status, service_state, ...})

  - id: driver-loaded-status-running
    type: stdout_contains
    source: step-0
    expected: "\"service_state\":\"Running\""
    severity: critical
    description: "ExampleReg driver service loaded and reports Running"

  - id: worker-report-matched
    type: stdout_contains
    source: step-2
    expected: "\"matched\": true"
    severity: critical
    description: "Worker JSON report has matched=true (all sub-steps passed)"

  - id: worker-report-no-mismatches
    type: stdout_contains
    source: step-2
    expected: "\"mismatches\": []"
    severity: critical
    description: "Worker JSON report shows zero per-step mismatches"

  - id: worker-report-deny-step-passed
    type: stdout_contains
    source: step-2
    expected: "denied as expected"
    severity: critical
    description: "Worker step 'create_denied_path' received ERROR_ACCESS_DENIED from CM callback"

  - id: worker-report-allow-step-passed
    type: stdout_contains
    source: step-2
    expected: "succeeded as expected"
    severity: critical
    description: "Worker step 'create_allowed_path' received ERROR_SUCCESS (no false positive)"

  - id: driver-unloaded-stopped
    type: stdout_contains
    source: step-3
    expected: "\"service_state\":\"Stopped\""
    severity: critical
    description: "ExampleReg driver unloaded cleanly (no Driver Verifier bugcheck on unload)"

  # Sprint 60.8b Phase 2a diagnostic — silo-spawn-helper queries
  # IOCTL_OSP_REG_DIAG_LAST_PATH and writes the driver's resolved
  # full path into step-2's JSON as `driver_last_resolved_path`. The
  # assertion just asserts the field is present — the actual value
  # is visible in workflow-outputs.json for debug. Phase 2c will
  # tighten this once we confirm the driver resolves to
  # "\REGISTRY\MACHINE\SOFTWARE\ExampleV2RegDeny..." as expected, at
  # which point the component-rule fallback in reg_callback.c can
  # be removed.
  - id: driver-last-path-captured
    type: stdout_contains
    source: step-2
    expected: "driver_last_resolved_path"
    severity: high
    description: "DIAG_LAST_PATH IOCTL returned a resolved path; see workflow-outputs.json for value"

pass_threshold: 1.0
critical_must_pass: true

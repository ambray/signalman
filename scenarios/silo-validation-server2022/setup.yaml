# Silo Validation Scenario (Server 2022) — Setup & Configuration
#
# Identical to silo-validation but targets a Windows Server 2022 VM.
# Server 2022 is the primary production target for silo-based sandboxing
# since it has full container/silo support built in.

name: "Server Silo Validation (Server 2022)"
version: "1.0"
tags: ["silo", "sandbox", "kernel-isolation", "windows-internals", "server-2022"]

# VM configuration — uses Server 2022 template with a distinct IP
vms:
  - name: endpoint-1
    template: windows-server-2022
    checkpoint_restore: agent-installed
    guest_agent_port: 50051
    network:
      switch: "InternalSwitch"
      static_ip: "172.30.0.20"

# Pre-test setup steps (executed sequentially)
setup:
  # Deploy the silo validation binary
  - action: vm_copy_file
    vm: endpoint-1
    src: ./artifacts/silo-validation.exe
    dest: "C:\\Example\\tools\\silo-validation.exe"

  # Run the full validation suite
  - action: vm_run_command
    vm: endpoint-1
    command: "C:\\Example\\tools\\silo-validation.exe"
    args: ["--all", "--output", "C:\\Example\\logs\\silo-results.json"]
    timeout_ms: 120000

  # Retrieve results from the VM
  - action: vm_copy_file
    vm: endpoint-1
    src: "C:\\Example\\logs\\silo-results.json"
    dest: ./results/silo-results.json
    direction: from_vm

# Post-test teardown
teardown:
  - action: vm_restore
    vm: endpoint-1
    checkpoint: agent-installed

# Checkpoint strategy
checkpoints:
  before_test: true
  on_failure: true

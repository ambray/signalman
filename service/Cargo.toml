[package]
name = "signalman-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Signalman host control-plane service. Replaces per-call gsudo elevation for Hyper-V management."

[[bin]]
name = "signalman-service"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
tokio-stream = "0.1"
tonic = { workspace = true, features = ["tls"] }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

# Async traits and helpers used by the dispatcher
async-trait = "0.1"
futures = "0.3"
hyper = "1"
hyper-util = "0.1"
tower = "0.5"

# rustls + cert generation
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }

# Windows service control + named pipes (cfg target = windows)
[target.'cfg(target_os = "windows")'.dependencies]
windows-service = "0.7"
tokio-util = { version = "0.7", features = ["compat"] }

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    # P4.c B6: SDDL parsing for named-pipe SECURITY_DESCRIPTOR.
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
]

[build-dependencies]
tonic-build = { workspace = true }
protoc-bin-vendored = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
async-trait = "0.1"
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy"] }
tokio-stream = "0.1"
futures = "0.3"
